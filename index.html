    <!-- Manrope Font -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Babel Standalone for JSX -->

    <style>
      * {
        font-family: "Manrope", sans-serif;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
      }

      /* Parallax effect */
      .parallax-wrapper {
        transform-style: preserve-3d;
      }

      .parallax-layer {
        transition: transform 0.3s ease-out;
      }

      /* Custom animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate3d(0, -20px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translate3d(0, 30px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(234, 88, 12, 0.3);
        }
        50% {
          box-shadow: 0 0 30px rgba(234, 88, 12, 0.5);
        }
      }

      /* Smooth animations without blur */
      .smooth-animate {
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        -webkit-font-smoothing: subpixel-antialiased;
      }

      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }

      .shimmer {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 100%
        );
        background-size: 1000px 100%;
        animation: shimmer 3s infinite;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #171717;
      }

      ::-webkit-scrollbar-thumb {
        background: #ea580c;
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #c2410c;
      }

      /* Focus states for accessibility */
      *:focus-visible {
        outline: 2px solid #ea580c;
        outline-offset: 2px;
      }
    </style>
  </head>

      const PorkAndGoLinktree = () => {
        const [menuOpen, setMenuOpen] = useState(false);
        const [isVisible, setIsVisible] = useState(false);
        const [imagesLoaded, setImagesLoaded] = useState(0);
        const [isOpen, setIsOpen] = useState(true);
        const [showScrollTop, setShowScrollTop] = useState(false);
        const [shareSuccess, setShareSuccess] = useState(false);
        const [comingSoonOpen, setComingSoonOpen] = useState(false);
        const totalImages = 7;
        const containerRef = useRef(null);

        useEffect(() => {
          setIsVisible(true);

          // Check if restaurant is open (8 AM - 10 PM)
          const checkOpenStatus = () => {
            const now = new Date();
            const currentHour = now.getHours();
            setIsOpen(currentHour >= 8 && currentHour < 22);
          };

          checkOpenStatus();
          const interval = setInterval(checkOpenStatus, 60000);

          return () => clearInterval(interval);
        }, []);

        useEffect(() => {
          if (menuOpen) {
            setImagesLoaded(0);
            document.body.style.overflow = "hidden";
          } else {
            document.body.style.overflow = "unset";
          }

          return () => {
            document.body.style.overflow = "unset";
          };
        }, [menuOpen]);

        // Scroll to top handler
        const scrollToTop = () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        // Track scroll for back to top button
        useEffect(() => {
          const handleScroll = () => {
            setShowScrollTop(window.scrollY > 400);
          };

          window.addEventListener("scroll", handleScroll);
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        // Share functionality
        const handleShare = async () => {
          const shareData = {
            title: "Pork & Go - We Got The Meats",
            text: "Check out Pork & Go restaurant! Premium meats in Nairobi CBD.",
            url: window.location.href,
          };

          try {
            if (navigator.share) {
              await navigator.share(shareData);
            } else {
              // Fallback: copy to clipboard
              await navigator.clipboard.writeText(window.location.href);
              setShareSuccess(true);
              setTimeout(() => setShareSuccess(false), 2000);
            }
          } catch (err) {
            console.log("Error sharing:", err);
          }
        };

        const trackClick = (linkName) => {
          console.log(`Link clicked: ${linkName}`);
          // Add your analytics tracking here
        };

            alt: "Nyama Nyama Platters",
            title: "Platters",
          },

            alt: "White Meat Menu",
            title: "White Meat",
          },
          {
            src: "images/png-4.png",
            alt: "Burgers & Wraps",
            title: "Burgers & Wraps",
          },
          {
            src: "images/png-5.png",
            alt: "Drinks Menu",
            title: "Drinks",
          },
          {
            src: "images/png-6.png",
            alt: "Desserts Menu",
            title: "Desserts",
          },
          {
            src: "images/png-7.png",
            alt: "Wines & Cocktails",
            title: "Wines & Cocktails",
          },
        ];

        const links = [
          {
            icon: MapPin,
            text: "New Location - Development House",
            subtext: "Opposite Afya centre• Now Open",
            href: "https://maps.app.goo.gl/Ry71wsTaM5CkxEsd6",
            primary: false,
            isNew: true,
            onClick: () => trackClick("New Location - Development House"),
          },
          {
            icon: MapPin,
            text: "Visit Us - Nairobi CBD • Braidwood House",
            subtext: "Tom Mboya St • 8AM-10PM • Dine-in & Takeaway",
            href: "https://maps.app.goo.gl/swjF8fk4HTB4Aq9A9",
            primary: false,
            showStatus: true,
          },
          {
            icon: Menu,
            text: "View Full Menu",
            subtext: "See what we offer",
            onClick: () => {
              setMenuOpen(true);
              trackClick("Menu");
            },
            primary: false,
          },
          {
            icon: WhatsApp,
            text: "WhatsApp Order",
            subtext: "Chat with us directly",
            href: "https://wa.me/254710554077?text=Hi%20Pork%20%26%20Go!%20I'd%20like%20to%20place%20an%20order",

              {/* Main Links */}

                    <LinkComponent
                      key={index}
                      href={link.href}
                      onClick={link.onClick}
                      target={link.href ? "_blank" : undefined}
                      rel={link.href ? "noopener noreferrer" : undefined}
                      className={`smooth-animate group w-full bg-white hover:bg-neutral-50 border ${
                        link.isNew ? 'border-orange-500 bg-orange-50/30' : 'border-neutral-200'

                        link.primary ? "p-5" : "p-4"
                      } flex items-center gap-4 cursor-pointer text-left relative ${
                        isVisible
                          ? "opacity-100 translate-y-0"
                          : "opacity-0 translate-y-10"
                      }`}
                      style={{ 
                        transitionDelay: `${(index + 2) * 100}ms`,
                        transform: 'translate3d(0, 0, 0)'
                      }}
                      aria-label={link.text}
                    >
                      {/* NEW Badge */}
                      {link.isNew && (
                        <div className="absolute -top-2 -right-2 bg-gradient-to-r from-orange-500 to-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1 animate-pulse">
                          <Sparkles className="w-3 h-3" />

                        </div>
                      )}
                      
                      {/* Open/Closed Status Badge */}
                      {link.showStatus && (
                        <div className={`absolute -top-2 -right-2 ${

                        </div>
                        {link.subtext && (

                          </div>

                      </div>
                      <div className="text-orange-600 text-lg transition-transform duration-200 group-hover:translate-x-1">
                        →

              </div>

              {/* Social Links */}

                  isVisible ? "opacity-100 scale-100" : "opacity-0 scale-95"

              >
                {socialLinks.map((social, index) => {
                  const Icon = social.icon;
                  return (
                    <a
                      key={index}
                      href={social.href}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="smooth-animate bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white rounded-full p-3 transition-all duration-200 shadow-sm hover:shadow-lg group"
                      aria-label={social.text}
                      onClick={() => trackClick(social.text)}
                      style={{ transform: 'translate3d(0, 0, 0)' }}
                    >
                      <Icon className="w-6 h-6" />
                    </a>
                  );
                })}
              </div>

              {/* Share Button */}
              <div
                className={`flex justify-center mb-10 transition-all duration-700 delay-600 ${
                  isVisible ? "opacity-100" : "opacity-0"
                }`}
              >
                <button
                  onClick={handleShare}
                  className="smooth-animate inline-flex items-center gap-2 bg-white hover:bg-neutral-50 text-neutral-700 px-6 py-3 rounded-full font-medium text-sm border border-neutral-200 hover:border-orange-500 transition-all duration-200 shadow-sm hover:shadow-md"
                  aria-label="Share this page"
                  style={{ transform: 'translate3d(0, 0, 0)' }}
                >
                  <Share2 className="w-4 h-4" />
                  {shareSuccess ? "Link Copied!" : "Share"}
                </button>
              </div>

              {/* Footer */}
              <div
                className={`text-center text-neutral-400 transition-all duration-1000 delay-800 ${
                  isVisible ? "opacity-100" : "opacity-0"
                }`}
              >
                <p className="text-xs">
                  © 2025 Pork & Go 🔥 All Rights Reserved
                </p>
              </div>
            </div>

            {/* Back to Top Button */}
            {showScrollTop && (
              <button
                onClick={scrollToTop}
                className="smooth-animate fixed bottom-6 right-6 bg-orange-600 hover:bg-orange-700 text-white rounded-full p-3 shadow-2xl z-40 transition-all duration-200"
                aria-label="Scroll to top"
                style={{
                  animation: "slideUp 0.3s ease-out",
                  transform: 'translate3d(0, 0, 0)'
                }}
              >
                <ChevronUp className="w-5 h-5" />
              </button>
            )}

            {/* Menu Modal */}
            {menuOpen && (
              <div
                className="fixed inset-0 bg-black bg-opacity-95 z-50 overflow-y-auto"
                onClick={() => setMenuOpen(false)}
                style={{ animation: "fadeIn 0.3s ease-out" }}
              >
                <div className="min-h-screen px-4 py-20">
                  {/* Close Button */}
                  <button
                    onClick={() => setMenuOpen(false)}
                    className="fixed top-6 right-6 bg-orange-600 hover:bg-orange-700 text-white rounded-full p-3 shadow-2xl z-50 transition-all duration-300 hover:scale-110"
                    aria-label="Close menu"
                  >
                    <X className="w-5 h-5" />
                  </button>

                  {/* Back to Top in Menu */}
                  {showScrollTop && (
                    <button
                      onClick={scrollToTop}
                      className="fixed bottom-6 right-6 bg-white hover:bg-neutral-100 text-orange-600 rounded-full p-3 shadow-2xl z-50 transition-all duration-300 hover:scale-110"
                      aria-label="Scroll to top"
                    >
                      <ChevronUp className="w-5 h-5" />
                    </button>
                  )}

                  {/* Menu Title */}
                  <div
                    className="text-center mb-10"
                    style={{ animation: "slideDown 0.5s ease-out" }}
                  >
                    <h2 className="text-3xl font-bold text-white mb-2">
                      Our Menu
                    </h2>
                    <p className="text-neutral-400 text-sm">
                      Explore our menu and discover your next favorite dish
                    </p>
                  </div>

                  {/* Loading Spinner */}
                  {imagesLoaded < totalImages && (
                    <div className="flex flex-col items-center justify-center mb-8">
                      <div className="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin"></div>
                      <p className="text-neutral-400 text-sm mt-3">
                        Loading menu... ({imagesLoaded}/{totalImages})
                      </p>
                    </div>
                  )}

                  {/* Menu Images */}
                  <div
                    className="max-w-3xl mx-auto space-y-8"
                    onClick={(e) => e.stopPropagation()}
                  >
                    {menuImages.map((image, index) => (
                      <div
                        key={index}
                        style={{
                          animation: "slideUp 0.6s ease-out",
                          animationDelay: `${index * 100}ms`,
                          animationFillMode: "both",
                        }}
                      >
                        <h3 className="text-lg font-semibold text-orange-500 mb-3 text-center">
                          {image.title}
                        </h3>
                        <img
                          src={image.src}
                          alt={image.alt}
                          loading="lazy"
                          onLoad={() => setImagesLoaded((prev) => prev + 1)}
                          className="w-full rounded-xl shadow-2xl transition-transform duration-300 hover:scale-[1.02]"
                        />
                      </div>
                    ))}
                  </div>

                  {/* Bottom Spacing */}
                  <div className="h-20"></div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // Render the app
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<PorkAndGoLinktree />);
    </script>
  </body>
</html>
