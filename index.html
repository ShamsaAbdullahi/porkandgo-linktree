      * {
        font-family: "Manrope", sans-serif;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        padding: 0;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #fff5f0 0%,
          #ffffff 50%,
          #fff5f0 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition:
          opacity 0.5s ease-out,
          visibility 0.5s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loading-logo {
        width: 200px;
        height: auto;
        margin-bottom: 30px;
        animation: fadeInScale 0.6s ease-out;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #fed7aa;
        border-top: 4px solid #ea580c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        margin-top: 20px;
        color: #ea580c;
        font-size: 16px;
        font-weight: 600;
        animation: pulse 2s ease-in-out infinite;
      }
      .loading-tagline {
        margin-top: 8px;
        color: #9ca3af;
        font-size: 14px;
        font-weight: 500;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes fadeInScale {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      .parallax-wrapper {
        transform-style: preserve-3d;
      }
      .parallax-layer {
        transition: transform 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate3d(0, -20px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translate3d(0, 30px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(234, 88, 12, 0.3);
        }
        50% {
          box-shadow: 0 0 30px rgba(234, 88, 12, 0.5);
        }
      }
      .smooth-animate {
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        -webkit-font-smoothing: subpixel-antialiased;
      }
      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }
      .shimmer {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 100%
        );
        background-size: 1000px 100%;
        animation: shimmer 3s infinite;
      }
      .image-skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #171717;
      }
      ::-webkit-scrollbar-thumb {
        background: #ea580c;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c2410c;
      }
      *:focus-visible {
        outline: 2px solid #ea580c;
        outline-offset: 2px;
      }
      .progressive-image {
        position: relative;
        overflow: hidden;
      }
      .progressive-image img {
        transition: opacity 0.3s ease-in-out;
      }
      .progressive-image img.loading {
        opacity: 0;
      }
      .progressive-image img.loaded {
        opacity: 1;
      }
      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      #root.loaded {
        opacity: 1;
      }

        font-weight: 700;
        text-decoration: none;

    </style>

    <script>
      (function () {
        function revealPage() {
          const loadingScreen = document.getElementById("loading-screen");
          const root = document.getElementById("root");
          if (root) root.classList.add("loaded");
          if (loadingScreen) {
            loadingScreen.classList.add("hidden");
            setTimeout(() => {
              loadingScreen.style.display = "none";
            }, 500);
          }
        }

        window.revealPorkAndGoPage = revealPage;
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () =>
            setTimeout(revealPage, 900),
          );
        } else {
          setTimeout(revealPage, 900);
        }
        window.addEventListener("load", () => setTimeout(revealPage, 250));
        setTimeout(revealPage, 3500);
      })();
    </script>

      const ProgressiveImage = ({ src, alt, className, onLoad }) => {
        const [isLoaded, setIsLoaded] = useState(false);
        const [isInView, setIsInView] = useState(false);
        const imgRef = useRef(null);

        useEffect(() => {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setIsInView(true);
                  observer.unobserve(entry.target);
                }
              });
            },
            { rootMargin: "50px" },
          );
          if (imgRef.current) observer.observe(imgRef.current);
          return () => {
            if (imgRef.current) observer.unobserve(imgRef.current);
          };
        }, []);

        const handleLoad = () => {
          setIsLoaded(true);
          if (onLoad) onLoad();
        };

        return (
          <div ref={imgRef} className="progressive-image">
            {!isLoaded && <div className={`${className} image-skeleton`}></div>}
            {isInView && (
              <img
                src={src}
                alt={alt}
                className={`${className} ${isLoaded ? "loaded" : "loading"}`}
                onLoad={handleLoad}
                loading="lazy"
                decoding="async"
              />
            )}
          </div>
        );
      };

            text: "Visit Us - Nairobi CBD • Braidwood House",
            subtext: "Tom Mboya St • 8AM-10PM • Dine-in & Takeaway",
            href: "https://maps.app.goo.gl/swjF8fk4HTB4Aq9A9",
            primary: false,
            showStatus: true,
          },
          {
            icon: Menu,
            text: "View Full Menu",
            subtext: "See what we offer",
            onClick: () => {
              setMenuOpen(true);
              trackClick("Menu");
            },
            primary: false,
          },
          {
            icon: WhatsApp,
            text: "WhatsApp Order",
            subtext: "Chat with us directly",
            href: "https://wa.me/254710554077?text=Hi%20Pork%20%26%20Go!%20I'd%20like%20to%20place%20an%20order",
            primary: false,
            onClick: () => trackClick("WhatsApp"),
          },
          {
            icon: Phone,
            text: "Call to Order",
            subtext: "0710 554 077",
            href: "tel:0710554077",
            primary: false,
            onClick: () => trackClick("Phone"),
          },
        ];

        const socialLinks = [
          {
            icon: Instagram,
            text: "Instagram",
            href: "https://www.instagram.com/pork_and_go/",
          },
          {
            icon: TikTok,
            text: "TikTok",
            href: "https://www.tiktok.com/@porkandgo",
          },
          {
            icon: Facebook,
            text: "Facebook",
            href: "https://www.facebook.com/porkandgokenya/",
          },
        ];

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-50/40 via-white to-orange-50/20 py-6 px-4 relative">
            <div
              ref={containerRef}
              className={`max-w-lg mx-auto transition-all duration-1000 transform ${isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-10"}`}
            >
              {/* Logo */}
              <div className="text-center mb-6 smooth-animate">
                <img
                  src="images/png_logo.png"
                  alt="Pork & Go - We Got The Meats"
                  className="w-48 sm:w-52 md:w-60 max-w-full h-auto mx-auto transition-transform duration-300 hover:scale-105"
                  loading="eager"
                  decoding="async"
                />
              </div>

              {/* Main Links */}
              <div className="space-y-3 mb-6">
                {links.map((link, index) => {
                  const Icon = link.icon;
                  const LinkComponent = link.href ? "a" : "button";
                  return (
                    <LinkComponent
                      key={index}
                      href={link.href}
                      onClick={link.onClick}
                      target={link.href ? "_blank" : undefined}
                      rel={link.href ? "noopener noreferrer" : undefined}
                      className={`smooth-animate group w-full bg-white hover:bg-neutral-50 border ${link.isNew ? "border-orange-500 bg-orange-50/30" : "border-neutral-200"} hover:border-orange-500 rounded-2xl shadow-sm hover:shadow-lg transition-all duration-200 ${link.primary ? "p-5" : "p-4"} flex items-center gap-4 cursor-pointer text-left relative ${isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-10"}`}
                      style={{
                        transitionDelay: `${(index + 2) * 100}ms`,
                        transform: "translate3d(0, 0, 0)",
                      }}
                      aria-label={link.text}
                    >
                      {link.isNew && (
                        <div className="absolute -top-2 -right-2 bg-gradient-to-r from-orange-500 to-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1 animate-pulse">
                          <Sparkles className="w-3 h-3" />
                          NEW
                        </div>
                      )}
                      {link.showStatus && (
                        <div
                          className={`absolute -top-2 -right-2 ${isOpen ? "bg-green-500" : "bg-red-500"} text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1`}
                        >
                          <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
                          {isOpen ? "OPEN" : "CLOSED"}
                        </div>
                      )}
                      <div
                        className={`${link.isNew ? "bg-orange-100" : "bg-orange-50"} rounded-xl p-3 group-hover:bg-orange-100 transition-colors duration-200`}
                      >
                        <Icon className="w-5 h-5 text-orange-600" />
                      </div>
                      <div className="flex-1">
                        <div
                          className={`font-semibold text-neutral-900 ${link.primary ? "text-base" : "text-sm"}`}
                        >
                          {link.text}
                        </div>
                        {link.subtext && (
                          <div className="text-xs text-neutral-500 mt-0.5">
                            {link.subtext}
                          </div>
                        )}
                      </div>
                      <div className="text-orange-600 text-lg transition-transform duration-200 group-hover:translate-x-1">
                        →
                      </div>
                    </LinkComponent>
                  );
                })}
              </div>

              {/* Social Links */}
              <div
                className={`flex justify-center items-center gap-4 mb-6 transition-all duration-700 delay-500 ${isVisible ? "opacity-100 scale-100" : "opacity-0 scale-95"}`}
              >
                {socialLinks.map((social, index) => {
                  const Icon = social.icon;
                  return (
                    <a
                      key={index}
                      href={social.href}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="smooth-animate bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white rounded-full p-3 transition-all duration-200 shadow-sm hover:shadow-lg group"
                      aria-label={social.text}
                      onClick={() => trackClick(social.text)}
                      style={{ transform: "translate3d(0, 0, 0)" }}
                    >
                      <Icon className="w-6 h-6" />
                    </a>
                  );
                })}
              </div>

              {/* Share */}
              <div
                className={`flex justify-center mb-10 transition-all duration-700 delay-600 ${isVisible ? "opacity-100" : "opacity-0"}`}
              >
                <button
                  onClick={handleShare}
                  className="smooth-animate inline-flex items-center gap-2 bg-white hover:bg-neutral-50 text-neutral-700 px-6 py-3 rounded-full font-medium text-sm border border-neutral-200 hover:border-orange-500 transition-all duration-200 shadow-sm hover:shadow-md"
                  aria-label="Share this page"
                  style={{ transform: "translate3d(0, 0, 0)" }}
                >
                  <Share2 className="w-4 h-4" />
                  {shareSuccess ? "Link Copied!" : "Share"}
                </button>
              </div>

              {/* Footer */}
              <div
                className={`text-center text-neutral-400 transition-all duration-1000 delay-800 ${isVisible ? "opacity-100" : "opacity-0"}`}
              >
                <p className="text-xs">
                  © 2026 Pork & Go 🔥 All Rights Reserved
                </p>
              </div>
            </div>

            {/* Scroll to Top */}
            {showScrollTop && (
              <button
                onClick={scrollToTop}
                className="smooth-animate fixed bottom-6 right-6 bg-orange-600 hover:bg-orange-700 text-white rounded-full p-3 shadow-2xl z-40 transition-all duration-200"
                aria-label="Scroll to top"
                style={{
                  animation: "slideUp 0.3s ease-out",
                  transform: "translate3d(0, 0, 0)",
                }}
              >
                <ChevronUp className="w-5 h-5" />
              </button>
            )}

            {/* Menu Modal */}
            {menuOpen && (
              <div
                className="fixed inset-0 bg-black bg-opacity-95 z-50 overflow-y-auto"
                onClick={() => setMenuOpen(false)}
                style={{ animation: "fadeIn 0.3s ease-out" }}
              >
                <div className="min-h-screen px-4 py-20">
                  <button
                    onClick={() => setMenuOpen(false)}
                    className="fixed top-6 right-6 bg-orange-600 hover:bg-orange-700 text-white rounded-full p-3 shadow-2xl z-50 transition-all duration-300 hover:scale-110"
                    aria-label="Close menu"
                  >
                    <X className="w-5 h-5" />
                  </button>
                  {showScrollTop && (
                    <button
                      onClick={scrollToTop}
                      className="fixed bottom-6 right-6 bg-white hover:bg-neutral-100 text-orange-600 rounded-full p-3 shadow-2xl z-50 transition-all duration-300 hover:scale-110"
                      aria-label="Scroll to top"
                    >
                      <ChevronUp className="w-5 h-5" />
                    </button>
                  )}
                  <div
                    className="text-center mb-10"
                    style={{ animation: "slideDown 0.5s ease-out" }}
                  >
                    <h2 className="text-3xl font-bold text-white mb-2">
                      Our Menu
                    </h2>
                    <p className="text-neutral-400 text-sm">
                      Explore our menu and discover your next favorite dish
                    </p>
                  </div>
                  {imagesLoaded < totalImages && (
                    <div className="flex flex-col items-center justify-center mb-8">
                      <div className="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin"></div>
                      <p className="text-neutral-400 text-sm mt-3">
                        Loading menu... ({imagesLoaded}/{totalImages})
                      </p>
                    </div>
                  )}
                  <div
                    className="max-w-3xl mx-auto space-y-8"
                    onClick={(e) => e.stopPropagation()}
                  >
                    {menuImages.map((image, index) => (
                      <div
                        key={index}
                        style={{
                          animation: "slideUp 0.6s ease-out",
                          animationDelay: `${index * 100}ms`,
                          animationFillMode: "both",
                        }}
                      >
                        <h3 className="text-lg font-semibold text-orange-500 mb-3 text-center">
                          {image.title}
                        </h3>
                        <ProgressiveImage
                          src={image.src}
                          alt={image.alt}
                          className="w-full rounded-xl shadow-2xl transition-transform duration-300 hover:scale-[1.02]"
                          onLoad={() => setImagesLoaded((prev) => prev + 1)}
                        />
                      </div>
                    ))}
                  </div>
                  <div className="h-20"></div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<PorkAndGoLinktree />);
    </script>
  </body>
</html>
